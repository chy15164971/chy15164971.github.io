<!-- 阅读进度条 -->
<div class="reading-progress" id="readingProgress" aria-hidden="true"></div>

<!-- 回到顶部 -->
<button class="to-top" id="toTop" type="button" aria-label="回到顶部" title="回到顶部">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
</button>

<script>
(function () {
  var bar = document.getElementById('readingProgress');
  var btn = document.getElementById('toTop');
  if (!bar || !btn) return;

  var ticking = false;
  function update() {
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    var pct = max > 0 ? (h.scrollTop || document.body.scrollTop) / max : 0;
    bar.style.transform = 'scaleX(' + pct + ')';
    btn.classList.toggle('is-visible', (h.scrollTop || document.body.scrollTop) > 420);
    ticking = false;
  }
  function onScroll() {
    if (!ticking) { window.requestAnimationFrame(update); ticking = true; }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  btn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  update();
})();
</script>
