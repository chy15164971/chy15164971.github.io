# ── 写作台（Sveltia CMS）配置 ──────────────────────────────────────────
# 入口：https://chy15164971.github.io/admin/
# 登录：首屏点「Sign In Using Access Token」→ 粘贴 GitHub Token（见下方 auth_methods 说明）
#       Token 只存在你自己浏览器的本地存储里，不会进仓库。
# 保存/发布 = 直接提交到本仓库 → GitHub Pages 自动重建（约 1 分钟生效）。

backend:
  name: github
  repo: chy15164971/chy15164971.github.io
  branch: master

  # ⚠️ 只允许 Token 登录，禁用 OAuth 登录按钮。
  #    原因：本仓库是 GitHub Pages 静态站，没有 OAuth 服务端。若不写这一行，
  #    登录页会同时显示「Sign In」（OAuth）按钮，点击后 Sveltia 会回退到它内置的
  #    默认中转 https://api.netlify.com/auth —— 你的站不在 Netlify 上，该地址返回
  #    404「Not Found」，即之前看到的报错。
  #    将来若部署了自己的 OAuth 中转（Cloudflare Worker），改成 auth_methods: [oauth, token]
  #    并取消下面 base_url 的注释，即可恢复「一键用 GitHub 登录」。
  auth_methods: [token]

  # 部署 Sveltia CMS Authenticator（Cloudflare Worker）后，取消注释并填入地址，
  # 同时把上面的 auth_methods 改为 [oauth, token]：
  # base_url: https://sveltia-cms-auth.你的子域.workers.dev

# 上传的图片提交到仓库的 images/uploads/，正文中以 /images/uploads/文件名 引用
media_folder: images/uploads
public_folder: /images/uploads

site_url: https://chy15164971.github.io
display_url: https://chy15164971.github.io

collections:
  # ── 文章 ────────────────────────────────────────────────────────────
  - name: posts
    label: 文章
    label_singular: 文章
    folder: _posts
    create: true
    identifier_field: title
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - label: 分类
        name: categories
        widget: select
        options:
          - UI设计
          - 语言学习
          - 生活随笔
        multiple: true
        default:
          - UI设计
        hint: 决定这篇文章出现在「文章」页的哪个分块
      - label: 摘要
        name: description
        widget: text
        required: false
        hint: 出现在首页卡片与搜索结果里，建议 20–40 字
      - label: 正文
        name: body
        widget: markdown

  # ── 图库 ────────────────────────────────────────────────────────────
  - name: gallery
    label: 图库
    label_singular: 图片
    folder: _gallery
    create: true
    identifier_field: title
    slug: "{{slug}}"
    sortable_fields: [order, title]
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 分类
        name: category
        widget: select
        options:
          - 设计
          - 摄影
          - 插画
        hint: 对应图库页顶部的筛选按钮
      - label: 图片
        name: image
        widget: image
      - label: 说明
        name: caption
        widget: string
        required: false
      - label: 排序
        name: order
        widget: number
        value_type: int
        required: false
        default: 99
        hint: 数字越小越靠前

  # ── 单页 ────────────────────────────────────────────────────────────
  - name: pages
    label: 单页
    files:
      - label: 关于
        name: about
        file: about.md
        fields:
          - label: 布局
            name: layout
            widget: hidden
            default: page
          - label: 标题
            name: title
            widget: string
            default: About
          - label: 正文
            name: body
            widget: markdown
