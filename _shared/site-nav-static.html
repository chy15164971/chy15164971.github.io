<!-- 站点统一导航条 · 静态首屏版 v2（2026-11-04）
     唯一真相源：_shared/site-nav-static.html，由 inject_shared.py 内联到七页 <body> 开头。
     为什么静态：v1 由 site-nav.js 在 DOMContentLoaded 后才 createElement 插入，任务台 HTML
     约 831KB，实测 FCP 1220ms / DCL 1555ms —— 中间约 335ms 首屏是「没有导航条的旧版
     任务台」，导航条插入后整页下移，用户看到闪一下旧画面。静态渲染后首屏解析即有导航条。
     当前页高亮与 PWA 注册仍由 _shared/site-nav.js 补（纯样式变化，不引起布局跳动）。
     品牌图标：__wsn_brand 前内联同款三卡组 SVG（与首页 logo / PWA 图标同源），
     用 inline 而非 <img> 引用外部文件——零额外请求、首屏即显示、离线绝对稳，且不依赖 SW 缓存；
     渐变 id 加 __wsn_ 前缀避免同页 id 冲突。
     2026-11-06 D-16：品牌由 <span> 改为 <a href="home.html">，四个子页可点左上角回首页。 -->
<style id="__wsn_style">
.__wsn_bar{display:flex;align-items:center;gap:14px;padding:7px 16px;box-sizing:border-box;
  width:100%;background:var(--card,#fff);color:var(--ink,#1f2430);
  border-bottom:1px solid var(--line,#e7ebf2);font-size:13px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  position:relative;z-index:1}
.__wsn_brand{display:inline-flex;align-items:center;gap:7px;font-weight:600;letter-spacing:.02em;white-space:nowrap;color:var(--ink,#1f2430);text-decoration:none;cursor:pointer}
.__wsn_icon{width:20px;height:20px;border-radius:5px;flex:none;display:block}
.__wsn_links{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.__wsn_links::-webkit-scrollbar{display:none}
.__wsn_links a{display:inline-flex;align-items:center;min-height:36px;padding:3px 11px;border-radius:999px;text-decoration:none;
  white-space:nowrap;color:var(--sub,#6b7280);border:1px solid transparent;transition:background .15s ease,color .15s ease}
.__wsn_links a:hover{background:var(--hover,var(--pri-soft,#eaf0ff));color:var(--ink,#1f2430)}
.__wsn_links a.__wsn_on{color:#fff;background:var(--pri-deep,#3D68F0);border-color:var(--pri-deep,#3D68F0)}
.__wsn_hint{font-size:12px;color:var(--sub,#9aa3b2);white-space:nowrap}
.__wsn_bar a:focus-visible{outline:2px solid var(--pri,#4F7CFF);outline-offset:2px}
/* 页面设置（2026-11-23）：齿轮 + 弹层。隐藏只收起入口，不删除任何页面数据。 */
.__wsn_links a[hidden]{display:none}
.__wsn_set{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;padding:0;
  border:1px solid var(--line,#e7ebf2);border-radius:9px;background:transparent;color:var(--sub,#6b7280);cursor:pointer}
.__wsn_set svg{width:15px;height:15px;display:block}
.__wsn_set:hover{background:var(--hover,var(--pri-soft,#eaf0ff));color:var(--ink,#1f2430)}
.__wsn_set[aria-expanded="true"]{background:var(--pri-deep,#3D68F0);border-color:var(--pri-deep,#3D68F0);color:#fff}
.__wsn_panel{position:fixed;top:52px;right:14px;width:min(344px,calc(100vw - 24px));box-sizing:border-box;z-index:9000;
  background:var(--card,#fff);color:var(--ink,#1f2430);border:1px solid var(--line,#e7ebf2);border-radius:14px;
  box-shadow:0 12px 36px rgba(20,28,50,.18);padding:14px 16px;font-size:13px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
.__wsn_panel[hidden]{display:none}
.__wsn_ph{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.__wsn_ph button,.__wsn_pf button,.__wsn_add button,.__wsn_row button{cursor:pointer;font:inherit;
  border:1px solid var(--line,#e7ebf2);border-radius:7px;background:var(--hover,rgba(127,140,170,.08));color:var(--ink,#1f2430)}
.__wsn_ph button{width:26px;height:26px;line-height:1;padding:0;font-size:16px}
.__wsn_pt{margin:6px 0 2px;font-size:11.5px;color:var(--sub,#6b7280);line-height:1.6}
.__wsn_rows{display:flex;flex-direction:column;gap:3px;max-height:252px;overflow:auto;margin:9px 0 2px}
.__wsn_row{display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:8px;background:var(--hover,rgba(127,140,170,.08))}
.__wsn_row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.__wsn_row .u{font-size:11px;color:var(--sub,#6b7280);max-width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.__wsn_row input[type=checkbox]{width:15px;height:15px;flex:none;margin:0;accent-color:var(--pri,#4F7CFF)}
.__wsn_row button{width:23px;height:23px;line-height:1;padding:0;font-size:12px;flex:none}
.__wsn_row button:disabled{opacity:.32;cursor:default}
.__wsn_add{display:flex;gap:5px;margin-top:9px}
.__wsn_add input{min-width:0;flex:1;padding:5px 7px;border:1px solid var(--line,#e7ebf2);border-radius:7px;
  background:var(--bg,#f5f7fb);color:var(--ink,#1f2430);font:inherit;font-size:12px}
.__wsn_add input:first-child{flex:0 0 72px}
.__wsn_add button,.__wsn_pf button{padding:5px 10px;font-size:12px}
.__wsn_err{font-size:11px;color:#c0392b;min-height:15px;margin-top:3px}
.__wsn_pf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;
  padding-top:9px;border-top:1px solid var(--line,#e7ebf2);font-size:11px;color:var(--sub,#6b7280)}
.__wsn_panel button:focus-visible,.__wsn_panel input:focus-visible{outline:2px solid var(--pri,#4F7CFF);outline-offset:1px}
@media(max-width:680px){.__wsn_bar{gap:9px;padding:6px 10px}.__wsn_hint{display:none}
  .__wsn_brand{min-height:44px}
  .__wsn_links a{padding:3px 9px;font-size:12px;min-height:44px}
  .__wsn_panel{top:48px;right:8px;left:8px;width:auto}}
@media(prefers-reduced-motion:reduce){.__wsn_links a{transition:none}}
</style>
